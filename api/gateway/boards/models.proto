syntax = "proto3";

option go_package = "github.com/bogi-lyceya-44/gateway/internal/pb/api/gateway/boards;gateway_boards";

package api.v1.gateway.boards;

import "google/protobuf/timestamp.proto";

message Board {
  int64 id = 1;
  string name = 2;
  repeated int64 topic_ids = 3;

  google.protobuf.Timestamp created_at = 4;
  google.protobuf.Timestamp updated_at = 5;
}
