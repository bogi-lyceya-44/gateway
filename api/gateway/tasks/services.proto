syntax = "proto3";

option go_package = "github.com/bogi-lyceya-44/gateway/internal/pb/api/gateway/tasks;gateway_tasks";

package api.v1.gateway.tasks;

import "google/protobuf/timestamp.proto";
import "google/api/annotations.proto";
import "api/gateway/tasks/models.proto";

service TaskService {
  rpc GetTask(GetTaskRequest) returns (GetTaskResponse) {
    option (google.api.http) = {
      get : "/api/v1/tasks/{id=*}"
    };
  }

  rpc CreateTask(CreateTaskRequest) returns (CreateTaskResponse) {
    option (google.api.http) = {
      post : "/api/v1/tasks"
      body : "*"
    };
  }

  rpc UpdateTask(UpdateTaskRequest) returns (UpdateTaskResponse) {
    option (google.api.http) = {
      patch : "/api/v1/tasks/{id=*}"
      body : "task_to_update"
    };
  }

  rpc DeleteTask(DeleteTaskRequest) returns (DeleteTaskResponse) {
    option (google.api.http) = {
      delete : "/api/v1/tasks/{id=*}"
    };
  }

  rpc GetAllTaskDependencies(GetAllTaskDependenciesRequest)
      returns (GetAllTaskDependenciesResponse) {
    option (google.api.http) = {
      get : "/api/v1/tasks/{id=*}/deps"
    };
  }
}

message GetTaskRequest { int64 id = 1; }

message GetTaskResponse { Task task = 1; }

message CreateTaskRequest {
  message TaskPrototype {
    string name = 1;
    string description = 2;
    repeated int64 deps = 3;
    Priority priority = 4;

    google.protobuf.Timestamp start_time = 5;
    google.protobuf.Timestamp finish_time = 6;
  }

  TaskPrototype task_to_create = 1;
}

message CreateTaskResponse { int64 id = 1; }

message UpdateTaskRequest {
  message TaskPrototype {
    optional string name = 1;
    optional string description = 2;
    repeated int64 deps = 3;
    optional Priority priority = 4;

    optional google.protobuf.Timestamp start_time = 6;
    optional google.protobuf.Timestamp finish_time = 7;
  }

  int64 id = 1;
  TaskPrototype task_to_update = 2;
}

message UpdateTaskResponse {}

message DeleteTaskRequest { int64 id = 1; }

message DeleteTaskResponse {}

message GetAllTaskDependenciesRequest { int64 id = 1; }

message GetAllTaskDependenciesResponse { repeated int64 ids = 1; }
